name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate skill frontmatter
        run: python3 scripts/validate_skills.py
      - name: Check install.sh syntax
        run: bash -n install.sh
